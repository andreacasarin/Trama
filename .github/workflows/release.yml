name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME;
          const match = /^v(.+)$/.exec(tag ?? "");
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!match || !versionPattern.test(match[1])) throw new Error(`Invalid release tag: ${tag}`);
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const manifestVersion = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
          if (packageVersion !== match[1] || manifestVersion !== match[1]) {
            throw new Error(`Tag ${tag}, package.json ${packageVersion}, and manifest.json ${manifestVersion} must match`);
          }
          const prerelease = match[1].split("+", 1)[0].includes("-");
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${match[1]}\nRELEASE_TAG=${tag}\nRELEASE_PRERELEASE=${prerelease}\n`);
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Build the clean pinned SQLite assets
        run: |
          node scripts/sqlite-wasm/build.mjs --clean
          node --input-type=module <<'NODE'
          import { getBuildContext, validateArtifactCache } from "./scripts/sqlite-wasm/build.mjs";
          const context = getBuildContext();
          const result = validateArtifactCache(context);
          if (!result.ok) throw new Error(`SQLite WASM cache verification failed: ${result.reason}`);
          console.log(`Verified SQLite WASM cache ${context.fingerprint}`);
          NODE

      - name: Run the full test suite
        run: npm test

      - name: Create and validate the release archive
        run: node scripts/package-release.mjs --version "$RELEASE_VERSION" --archive "dist/trama-$RELEASE_VERSION.zip"

      - name: Create or reconcile the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/trama-${RELEASE_VERSION}.zip"
          release_json=""
          create_status=0
          create_args=("$RELEASE_TAG" "$archive" --draft --title "Trama $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then create_args+=(--prerelease); fi
          gh release create "${create_args[@]}" || create_status=$?
          if (( create_status != 0 )); then
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets 2>/dev/null || true)"
            if [[ -z "$release_json" ]]; then
              exit "$create_status"
            fi
          else
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets)"
          fi

          node - "$release_json" "$RELEASE_TAG" "$RELEASE_PRERELEASE" <<'NODE'
          const release = JSON.parse(process.argv[2]);
          const expectedTag = process.argv[3];
          const expectedPrerelease = process.argv[4] === "true";
          if (release.tagName !== expectedTag) throw new Error(`Release tag mismatch: ${release.tagName}`);
          if (release.isPrerelease !== expectedPrerelease)
            throw new Error(`Release prerelease state mismatch for ${expectedTag}`);
          NODE

          asset="trama-${RELEASE_VERSION}.zip"
          draft="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).isDraft))' "$release_json")"
          has_asset="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.assets.some((asset) => asset.name === process.argv[2])))' "$release_json" "$asset")"
          if [[ "$has_asset" == "true" ]]; then
            existing_dir="$(mktemp -d)"
            trap 'rm -rf "$existing_dir"' EXIT
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "$existing_dir"
            node scripts/package-release.mjs --verify --version "$RELEASE_VERSION" --archive "$existing_dir/$asset"
          elif [[ "$draft" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "$archive"
          else
            echo "Published release $RELEASE_TAG is missing $asset; refusing to overwrite it" >&2
            exit 1
          fi

          if [[ "$draft" == "true" ]]; then
            edit_args=("$RELEASE_TAG" --draft=false)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then edit_args+=(--prerelease); else edit_args+=(--prerelease=false); fi
            gh release edit "${edit_args[@]}"
          fi
