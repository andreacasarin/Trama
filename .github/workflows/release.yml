name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Validate tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            release_title="Trama $GITHUB_REF_NAME"
            release_prerelease=false
          elif git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/develop; then
            release_title="Trama nightly $GITHUB_REF_NAME"
            release_prerelease=true
          else
            echo "Tag $GITHUB_REF_NAME is not reachable from main or develop" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            release_prerelease=true
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.GITHUB_REF_NAME;
          const match = /^v?(.+)$/.exec(tag ?? "");
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!match || !versionPattern.test(match[1])) throw new Error(`Invalid release tag: ${tag}`);
          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const manifestVersion = JSON.parse(fs.readFileSync("manifest.json", "utf8")).version;
          if (packageVersion !== match[1] || manifestVersion !== match[1]) {
            throw new Error(`Tag ${tag}, package.json ${packageVersion}, and manifest.json ${manifestVersion} must match`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${match[1]}\nRELEASE_TAG=${tag}\n`);
          NODE
          {
            echo "RELEASE_TITLE=$release_title"
            echo "RELEASE_PRERELEASE=$release_prerelease"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        run: npm audit --audit-level=high

      - name: Check license inventory
        run: npm run verify:licenses

      - name: Check derived versions
        run: npm run version:check

      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Build the clean pinned SQLite assets
        run: node scripts/sqlite-wasm/build.mjs --clean

      - name: Run the full test suite
        run: npm test

      - name: Create and validate the release archive
        run: node scripts/package-release.mjs --version "$RELEASE_VERSION" --archive "dist/trama-$RELEASE_VERSION.zip"

      - name: Create or reconcile the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/trama-${RELEASE_VERSION}.zip"
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets 2>/dev/null || true)"
          if [[ -z "$release_json" ]]; then
            create_args=("$RELEASE_TAG" --draft --title "$RELEASE_TITLE" --generate-notes)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then create_args+=(--prerelease); fi
            gh release create "${create_args[@]}"
            release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets)"
          fi

          node - "$release_json" "$RELEASE_TAG" <<'NODE'
          const release = JSON.parse(process.argv[2]);
          const expectedTag = process.argv[3];
          if (release.tagName !== expectedTag) throw new Error(`Release tag mismatch: ${release.tagName}`);
          NODE

          # Preserve an explicitly designated prerelease even with a numeric tag.
          if [[ "$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).isPrerelease))' "$release_json")" == "true" ]]; then
            RELEASE_PRERELEASE=true
          fi

          draft="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).isDraft))' "$release_json")"
          existing_dir="$(mktemp -d)"
          trap 'rm -rf "$existing_dir"' EXIT
          for asset in "$archive" main.js manifest.json styles.css; do
            name="${asset##*/}"
            has_asset="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.assets.some((asset) => asset.name === process.argv[2])))' "$release_json" "$name")"
            if [[ "$has_asset" == "true" ]]; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
              if [[ "$asset" == "$archive" ]]; then
                node scripts/package-release.mjs --verify --version "$RELEASE_VERSION" --archive "$existing_dir/$name"
              else
                cmp "$existing_dir/$name" "$asset"
              fi
            elif [[ "$draft" == "true" ]]; then
              gh release upload "$RELEASE_TAG" "$asset"
            else
              echo "Published release $RELEASE_TAG is missing $name; refusing to modify it" >&2
              exit 1
            fi
          done

          edit_args=("$RELEASE_TAG" --title "$RELEASE_TITLE")
          if [[ "$draft" == "true" ]]; then edit_args+=(--draft=false); fi
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then edit_args+=(--prerelease); else edit_args+=(--prerelease=false); fi
          gh release edit "${edit_args[@]}"
