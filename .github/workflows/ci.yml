name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        run: npm audit --audit-level=high

      - name: Check license inventory
        run: npm run verify:licenses

      - name: Check derived versions
        run: npm run version:check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

  sqlite-runtime:
    name: SQLite runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Build and verify SQLite
        run: node scripts/sqlite-wasm/build.mjs --clean

      - name: Upload SQLite runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sqlite-wasm-${{ github.run_id }}
          path: |
            sqlite3.mjs
            sqlite3.wasm
            .cache/sqlite-wasm/fingerprint.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  test:
    name: Tests
    needs: sqlite-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download SQLite runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sqlite-wasm-${{ github.run_id }}
          path: .

      - name: Test
        run: npm test
